<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<title>Print da aplicação · B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../abertura/base.css">
<style>
/* Slide de print, versão B: o slide vira a área de trabalho escura e a janela clara
   flutua sobre ela. A moldura é a de um navegador de verdade, com aba nomeada em
   cima e barra de ferramentas embaixo, e a janela sai pela borda inferior.

   Proporção: janela de 1360px, imagem de 850px de altura, moldura de 72px e faixa de
   título de 84px. Sobram 816px de janela dentro do quadro, ou 77% da área do slide.
   O corte na base come 106px da captura, 12% dela. A versão A corta menos e cresce
   menos: é essa a escolha entre as duas. */
.pk{background:#080B12}
.pk .mesh{background:radial-gradient(1200px 720px at 50% -22%,rgba(37,99,235,.26),transparent 58%),
  radial-gradient(1000px 620px at 105% 110%,rgba(37,99,235,.14),transparent 56%)}
.pk .grid-bg{background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:48px 48px}

.pk .strip{position:relative;z-index:3;display:flex;align-items:flex-end;gap:24px;
  height:84px;padding:20px 64px 0}
.pk .ttl{min-width:0}
.pk .ttl .kk{font-size:11.5px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--accent3);display:flex;align-items:center;gap:11px}
.pk .ttl .kk::before{content:'';width:22px;height:2px;border-radius:2px;background:currentColor;
  opacity:.75}
.pk .ttl h1{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1;color:#fff;
  margin-top:6px}
.pk .cap{margin-left:auto;font-size:14px;line-height:1.45;color:#9AA5B6;text-align:right;
  max-width:440px;flex-shrink:0;padding-bottom:3px}
.pk .cap b{color:#E8ECF3;font-weight:700}
.pk .tag{flex-shrink:0;font-size:12px;font-weight:600;padding:7px 15px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);color:#B8C0CE;
  white-space:nowrap;margin-bottom:2px}

/* a janela: moldura de navegador de duas linhas, aba nomeada e barra de endereço */
.pk .win{position:absolute;z-index:2;left:120px;top:84px;width:1360px;height:816px;
  border-radius:15px 15px 0 0;overflow:hidden;background:#fff;
  box-shadow:0 -1px 0 rgba(255,255,255,.35) inset,
             0 70px 140px -40px rgba(0,0,0,.78),
             0 24px 60px -28px rgba(0,0,0,.5)}
.pk .tabs{height:32px;background:#D9E0EA;display:flex;align-items:flex-end;gap:9px;
  padding:0 14px}
.pk .dots{display:flex;gap:8px;flex-shrink:0;padding-bottom:9px}
.pk .dots i{width:11px;height:11px;border-radius:50%}
.pk .dots i:nth-child(1){background:#F2645A}
.pk .dots i:nth-child(2){background:#F4BE4F}
.pk .dots i:nth-child(3){background:#5FC466}
.pk .tab{height:26px;background:#fff;border-radius:9px 9px 0 0;display:flex;align-items:center;
  gap:9px;padding:0 13px;font-size:12.5px;font-weight:600;color:#33415A;max-width:290px;
  white-space:nowrap}
.pk .tab .fav{width:13px;height:13px;border-radius:4px;background:var(--ink);flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.pk .tab .fav svg{width:9px;height:9px}
.pk .tab .x{color:#9AA6B6;font-size:13px;margin-left:2px}
.pk .plus{color:#7E8B9E;font-size:15px;padding-bottom:6px}
.pk .bar{height:40px;background:#fff;border-bottom:1px solid #E3E9F1;display:flex;
  align-items:center;gap:16px;padding:0 16px}
.pk .nav{display:flex;align-items:center;gap:15px;color:#7F8DA1;flex-shrink:0}
.pk .nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.pk .nav svg.off{color:#C2CBD8}
.pk .addr{flex:1;max-width:720px;margin:0 auto;height:26px;background:#F1F4F8;
  border-radius:999px;display:flex;align-items:center;gap:9px;padding:0 15px;font-size:13px;
  color:#5C6B80;overflow:hidden;white-space:nowrap}
.pk .addr svg{width:13px;height:13px;stroke:#7C8AA0;fill:none;stroke-width:1.8;flex-shrink:0}
.pk .addr .sch{color:#9DAABB}
.pk .addr b{color:#1F2937;font-weight:600}
.pk .rgt{display:flex;align-items:center;gap:14px;color:#7F8DA1;flex-shrink:0}
.pk .rgt svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.pk .rgt .av{width:20px;height:20px;border-radius:50%;background:#E3E9F1;
  border:1px solid #D3DBE6}
.pk .win img{display:block;width:100%}
</style></head><body>
<section class="slide dark pk">
  <div class="mesh"></div><div class="grid-bg"></div>

  <div class="strip">
    <div class="ttl">
      <div class="kk">Aba Panorama</div>
      <h1>O dia em uma tela</h1>
    </div>
    <p class="cap">O previsto para a hora contra o registrado, em <b>P3 e P2</b>,
      e a fila de maior risco agora.</p>
    <span class="tag">A aplicação · 1 de 10</span>
  </div>

  <div class="win">
    <div class="tabs">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="tab">
        <span class="fav"><svg viewBox="0 0 28 28" fill="none"><path d="M6 22L12 14L16 17L22 8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Cronos · Painel operacional<span class="x">&times;</span>
      </span>
      <span class="plus">+</span>
    </div>
    <div class="bar">
      <span class="nav">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4.5V10h-5.5"/></svg>
      </span>
      <span class="addr">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>
        <span class="sch">https://</span><b>cronos-locaweb.onrender.com</b><span class="sch">/</span>
      </span>
      <span class="rgt">
        <svg viewBox="0 0 24 24"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.7l5.4-.8z"/></svg>
        <span class="av"></span>
      </span>
    </div>
    <img src="../../../../sprints/sprint-3/prints/01-panorama.png" alt="">
  </div>
</section>
</body></html>
