<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<title>Print da aplicação · A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../abertura/base.css">
<style>
/* Slide de print, versão A: a janela ocupa quase todo o quadro e encosta na borda
   de baixo, como uma janela aberta na área de trabalho. Tudo o que sobra do slide
   é uma faixa de 77px no alto: marca, título e legenda em uma linha só.

   A conta da proporção: o print é 16:10 e o slide é 16:9, então a janela nunca cabe
   inteira na largura. Com 1346px de largura a imagem tem 841px de altura, a barra do
   navegador soma 42 e a faixa consome 77, o que empurra 60px para fora do quadro de
   baixo. Sobra 93% da captura visível e a janela cobre 77% da área do slide, contra
   os 48% da versão que estava no deck. */
.pw{background:var(--pg)}
.pw .mesh{background:radial-gradient(1200px 780px at 100% -18%,rgba(37,99,235,.15),transparent 54%),
  radial-gradient(900px 660px at -10% 108%,rgba(37,99,235,.10),transparent 56%)}

.pw .strip{position:relative;z-index:3;display:flex;align-items:center;gap:22px;
  height:77px;padding:17px 64px 0}
.pw .bi{width:32px;height:32px;border-radius:9px;background:var(--ink);display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.pw .bi svg{width:18px;height:18px}
.pw .bn{font-size:17px;font-weight:800;letter-spacing:-.3px;color:#000;margin-left:-12px}
.pw .sep{width:1px;height:34px;background:var(--line);flex-shrink:0}
.pw .ttl{min-width:0}
.pw .ttl .kk{font-size:11.5px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--accent)}
.pw .ttl h1{font-size:27px;font-weight:800;letter-spacing:-.9px;line-height:1.1;
  color:var(--head);margin-top:3px}
.pw .cap{margin-left:auto;font-size:14px;line-height:1.4;color:var(--tx);text-align:right;
  max-width:430px;flex-shrink:0;margin-right:6px}
.pw .cap b{color:var(--head);font-weight:700}
.pw .tag{flex-shrink:0;font-size:12px;font-weight:600;padding:7px 15px;border-radius:999px;
  background:#fff;border:1px solid var(--line);color:var(--accent);white-space:nowrap;
  box-shadow:0 4px 14px -8px rgba(37,99,235,.3)}

/* a janela. Cantos arredondados só em cima: a base sai do quadro, e arredondar
   embaixo mostraria uma borda que não existe. */
.pw .win{position:absolute;z-index:2;left:127px;top:77px;width:1346px;height:823px;
  border-radius:16px 16px 0 0;overflow:hidden;background:#fff;
  border:1px solid rgba(15,23,42,.14);border-bottom:none;
  box-shadow:0 -1px 0 rgba(255,255,255,.9) inset,
             0 60px 120px -46px rgba(15,23,42,.46),
             0 20px 44px -24px rgba(15,23,42,.24)}
.pw .chrome{height:42px;display:flex;align-items:center;gap:16px;padding:0 16px;
  background:linear-gradient(180deg,#F6F8FB,#E8EDF4);border-bottom:1px solid #DCE3EC}
.pw .dots{display:flex;gap:8px;flex-shrink:0}
.pw .dots i{width:11px;height:11px;border-radius:50%;background:#C4CDDA;
  box-shadow:inset 0 -1px 0 rgba(15,23,42,.08)}
.pw .nav{display:flex;align-items:center;gap:14px;color:#8593A6;flex-shrink:0}
.pw .nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.pw .nav svg.off{color:#BDC7D5}
.pw .addr{flex:1;max-width:690px;margin:0 auto;height:27px;background:#fff;
  border:1px solid #DDE4ED;border-radius:999px;display:flex;align-items:center;gap:9px;
  padding:0 15px;font-size:13px;color:#5C6B80;overflow:hidden;white-space:nowrap}
.pw .addr svg{width:13px;height:13px;stroke:#7C8AA0;fill:none;stroke-width:1.8;
  flex-shrink:0}
.pw .addr .sch{color:#9DAABB}
.pw .addr b{color:#1F2937;font-weight:600}
.pw .rgt{display:flex;align-items:center;gap:14px;color:#8593A6;flex-shrink:0}
.pw .rgt svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.pw .win img{display:block;width:100%}
</style></head><body>
<section class="slide light pw">
  <div class="mesh"></div><div class="grid-bg"></div>

  <div class="strip">
    <span class="bi"><svg viewBox="0 0 28 28" fill="none"><path d="M6 22L12 14L16 17L22 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="8" r="3" fill="none" stroke="#3B82F6" stroke-width="1.5"/><circle cx="22" cy="8" r="1.2" fill="#3B82F6"/></svg></span>
    <span class="bn">Cronos</span>
    <span class="sep"></span>
    <div class="ttl">
      <div class="kk">Aba Panorama</div>
      <h1>O dia em uma tela</h1>
    </div>
    <p class="cap">O previsto para a hora contra o registrado, em <b>P3 e P2</b>,
      e a fila de maior risco agora.</p>
    <span class="tag">A aplicação · 1 de 10</span>
  </div>

  <div class="win">
    <div class="chrome">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="nav">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4.5V10h-5.5"/></svg>
      </span>
      <span class="addr">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>
        <span class="sch">https://</span><b>cronos-locaweb.onrender.com</b><span class="sch">/</span>
      </span>
      <span class="rgt">
        <svg viewBox="0 0 24 24"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.7l5.4-.8z"/></svg>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg>
      </span>
    </div>
    <img src="../../../../sprints/sprint-3/prints/01-panorama.png" alt="">
  </div>
</section>
</body></html>
