<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>S3 bento</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--accent:#2563EB;--accent2:#3B82F6;--accent-l:#EFF6FF;--danger:#DC2626;--ink:#0A0E17;
 --g2:#525252;--g3:#737373;--g4:#A3A3A3;--g6:#E5E5E5;--g8:#F7F7F7;--font:'Outfit',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased}
.slide{width:1600px;height:900px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.grid-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
/* temas */
.dark{background:var(--ink);color:#E8ECF3}
.dark .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px}
.dark .mesh{position:absolute;inset:0;z-index:0;background:radial-gradient(1000px 640px at 8% -8%,rgba(37,99,235,.26),transparent 55%),radial-gradient(820px 600px at 112% 112%,rgba(37,99,235,.12),transparent 55%)}
.light{background:#fff;color:#111}
.light .mesh{position:absolute;inset:0;z-index:0;background:radial-gradient(1100px 700px at 92% -12%,rgba(37,99,235,.16),transparent 55%),radial-gradient(760px 560px at -8% 108%,rgba(37,99,235,.10),transparent 58%)}
.light .grid-bg{background-image:linear-gradient(rgba(17,24,39,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(17,24,39,.025) 1px,transparent 1px);background-size:44px 44px}
/* header */
.hd{position:relative;z-index:2;display:flex;align-items:center;gap:11px;padding:40px 60px 0}
.hd .bi{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.dark .hd .bi{background:#fff}.light .hd .bi{background:var(--ink)}
.hd .bi svg{width:19px;height:19px}
.hd .bn{font-size:18px;font-weight:800;letter-spacing:-.3px}.dark .hd .bn{color:#fff}.light .hd .bn{color:#000}
.hd .tag{margin-left:auto;font-size:12.5px;font-weight:600;letter-spacing:.2px;padding:7px 15px;border-radius:999px}
.dark .hd .tag{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#B8C0CE}
.light .hd .tag{background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);color:var(--accent)}
.body{position:relative;z-index:2;flex:1;padding:26px 60px 54px;display:flex;flex-direction:column;min-height:0}
/* eyebrow SEM mono — Outfit uppercase */
.eb{font-size:14px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase}
.dark .eb{color:var(--accent2)}.light .eb{color:var(--accent)}
.tt{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1.02;margin-top:14px}
.dark .tt{color:#fff}.tt .hl{color:var(--accent2)}.light .tt .hl{color:var(--accent)}
.lead{font-size:19px;line-height:1.5;margin-top:18px;max-width:640px}
.dark .lead{color:#98A2B3}.light .lead{color:#5b6472}
.ic{display:inline-flex;align-items:center;justify-content:center}
.ic svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.s3 .tt{font-size:40px}.s3 .body{padding-top:18px}
.s3 .bento{margin-top:22px;flex:1;display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:16px}
.s3 .c{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;justify-content:space-between}
.s3 .c.big{grid-row:span 2}.s3 .c.acc{background:linear-gradient(160deg,rgba(37,99,235,.18),rgba(37,99,235,.04));border-color:rgba(59,130,246,.4)}
.s3 .c.dgr{background:linear-gradient(160deg,rgba(220,38,38,.14),rgba(220,38,38,.03));border-color:rgba(220,38,38,.35)}
.s3 .ci{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.06);color:#93C5FD}.s3 .ci svg{width:24px;height:24px}
.s3 .c.dgr .ci{color:#FCA5A5}
.s3 .n{font-size:46px;font-weight:800;letter-spacing:-2px;color:#fff;line-height:1}.s3 .c.big .n{font-size:60px}
.s3 .n .u{font-size:20px;color:#8E97A8;font-weight:600}
.s3 .l{font-size:15px;color:#98A2B3;margin-top:8px;line-height:1.35}
.s3 .spark{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:14px}
.s3 .spark span{flex:1;background:rgba(59,130,246,.55);border-radius:3px}
</style></head><body><div class="slide dark s3"><div class="mesh"></div><div class="grid-bg"></div><div class="hd"><div class="bi"><svg viewBox="0 0 28 28" fill="none"><path d="M6 22L12 14L16 17L22 8" stroke="#0A0E17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="8" r="3" fill="none" stroke="#3B82F6" stroke-width="1.5"/><circle cx="22" cy="8" r="1.2" fill="#3B82F6"/></svg></div><div class="bn">Cronos</div><div class="tag">Análise · O terreno</div></div>
<div class="body">
  <div class="eb">Exploração · panorama</div>
  <div class="tt">A cara da operação, em números</div>
  <div class="bento">
    <div class="c big"><span class="ic ci"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M8 10h8M8 14h5"/></svg></span></span><div><div class="n">122.543</div><div class="l">incidentes registrados · jan/2023 a dez/2025</div>
      <div class="spark"><span style="height:35%"></span><span style="height:40%"></span><span style="height:38%"></span><span style="height:45%"></span><span style="height:90%"></span><span style="height:96%"></span><span style="height:88%"></span><span style="height:100%"></span></div></div></div>
    <div class="c acc"><span class="ic ci"><span class="ic"><svg viewBox="0 0 24 24"><path d="M2 12h4l2.5-7 4 14 2.5-7h6"/></svg></span></span><div><div class="n">85<span class="u">%</span></div><div class="l">vêm de monitoramento</div></div></div>
    <div class="c"><span class="ic ci"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></span></span><div><div class="n">66<span class="u">%</span></div><div class="l">fecham "Sem Intervenção"</div></div></div>
    <div class="c"><span class="ic ci"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></span></span><div><div class="n">25.600</div><div class="l">elegíveis ao KPI (21%)</div></div></div>
    <div class="c dgr"><span class="ic ci"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></span></span><div><div class="n">248</div><div class="l">violações de OLA · 0,97% dos elegíveis</div></div></div>
  </div>
</div></div></body></html>
