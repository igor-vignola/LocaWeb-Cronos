<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronos · Roteiro da banca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   ROTEIRO DA BANCA — slide de um lado, fala do outro.

   Não decide quem apresenta o quê: o marcador de dono sai da foto de propósito.
   O que ele decide é COMO se fala, e por isso cada slide tem três versões de
   fala para o dono do projeto escolher a que soa como ele.

   As falas moram no objeto FALAS, no fim do arquivo. Acrescentar slide é
   acrescentar entrada — o resto se monta sozinho.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --pg:#F4F6FA; --cd:#FFFFFF; --tt:#0B0F16; --tx:#3D4757; --tx2:#67717F;
  --tx3:#9AA3B0; --ln:#E4E8EF; --ac:#2563EB; --ac-bg:#EEF3FF;
  --ok:#0E7C5A; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--pg);color:var(--tx);
  font:400 15px/1.6 Outfit,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}

/* ── barra de cima ───────────────────────────────────────────────────────── */
header{
  flex-shrink:0;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:13px 26px;background:var(--cd);border-bottom:1px solid var(--ln);
}
.marca{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.marca b{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--tt)}
.marca span{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}

.grp{display:flex;align-items:center;gap:8px}
.grp > i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--tx3)}
.seg{display:flex;background:var(--pg);border:1px solid var(--ln);border-radius:9px;padding:3px}
.seg button{
  border:0;background:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  color:var(--tx2);padding:5px 13px;border-radius:6px;transition:.14s;white-space:nowrap;
}
.seg button:hover{color:var(--tt)}
.seg button[aria-pressed="true"]{background:var(--tt);color:#fff}

.relogio{
  font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--tx2);
  padding:6px 12px;background:var(--pg);border:1px solid var(--ln);border-radius:8px;
  white-space:nowrap;
}
.relogio b{color:var(--tt);font-weight:700}

/* ── trilha dos slides ───────────────────────────────────────────────────── */
.trilha{
  flex-shrink:0;display:flex;gap:4px;overflow-x:auto;padding:9px 26px;
  background:var(--cd);border-bottom:1px solid var(--ln);scrollbar-width:thin;
}
.trilha button{
  flex-shrink:0;width:30px;height:26px;border:1px solid var(--ln);background:var(--cd);
  border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:500;
  color:var(--tx3);transition:.12s;
}
.trilha button:hover{border-color:var(--tx3);color:var(--tx)}
.trilha button.tem{color:var(--tt);border-color:#C9D2E0}
.trilha button.aqui{background:var(--tt);border-color:var(--tt);color:#fff}
.trilha .corte{flex-shrink:0;width:1px;background:var(--ln);margin:0 6px}

/* ── palco ───────────────────────────────────────────────────────────────── */
main{
  flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);
  gap:26px;padding:24px 26px;overflow:hidden;
}
@media (max-width:1180px){
  main{grid-template-columns:1fr;overflow:auto}
}

.lado-slide{display:flex;flex-direction:column;gap:14px;min-width:0}
.moldura{
  background:var(--cd);border:1px solid var(--ln);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(11,15,22,.04),0 20px 44px -30px rgba(11,15,22,.35);
}
.moldura img{display:block;width:100%;height:auto}
.abaixo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)}
.abaixo .num{font-family:var(--mono);font-weight:700;color:var(--tt)}
.abaixo .lupa{
  margin-left:auto;border:1px solid var(--ln);background:var(--cd);border-radius:7px;
  padding:5px 11px;font:inherit;font-size:12.5px;color:var(--tx2);cursor:pointer;
}
.abaixo .lupa:hover{color:var(--tt);border-color:var(--tx3)}

/* ── coluna da fala ──────────────────────────────────────────────────────── */
.lado-fala{display:flex;flex-direction:column;min-height:0}
/* o cartão tem a altura do texto, e não a da coluna: esticado, um slide de
   trinta segundos virava uma caixa branca vazia de mil pixels */
.papel{
  flex:0 1 auto;min-height:0;overflow:auto;background:var(--cd);border:1px solid var(--ln);
  border-radius:14px;padding:26px 28px 30px;
  box-shadow:0 1px 2px rgba(11,15,22,.04);
}
.tit{margin:0 0 3px;font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--tt);
  text-wrap:balance}
.sub{margin:0 0 20px;font-size:13px;color:var(--tx3)}
.sub b{color:var(--ac);font-weight:600}

.fala p{margin:0 0 15px;font-size:17px;line-height:1.72;color:var(--tt)}
.fala p:last-child{margin-bottom:0}
.fala em{font-style:normal;background:linear-gradient(transparent 62%,#DBE7FF 0);
  padding:0 1px;font-weight:600}

.chaves{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.chaves li{
  display:flex;gap:13px;align-items:flex-start;font-size:16.5px;line-height:1.5;color:var(--tt);
  padding-bottom:11px;border-bottom:1px dashed var(--ln);
}
.chaves li:last-child{border-bottom:0;padding-bottom:0}
.chaves li::before{
  content:"";flex-shrink:0;width:7px;height:7px;margin-top:9px;border-radius:50%;
  background:var(--ac);
}
.chaves b{font-weight:700}
.chaves i{font-style:normal;color:var(--tx2);font-size:15px}

.nota{
  margin-top:24px;padding:13px 15px;background:var(--ac-bg);border-radius:10px;
  font-size:13.5px;line-height:1.6;color:#1E3A8A;
}
.nota b{font-weight:700}
.nota code{font-family:var(--mono);font-size:12.5px;background:rgba(37,99,235,.1);
  padding:1px 5px;border-radius:4px}

.vazio{padding:40px 0;text-align:center;color:var(--tx3);font-size:14.5px;line-height:1.7}
.vazio b{display:block;color:var(--tx2);font-weight:600;margin-bottom:5px}

.pe{
  flex-shrink:0;display:flex;align-items:center;gap:16px;padding-top:13px;
  font-size:12px;color:var(--tx3);
}
.pe kbd{
  font-family:var(--mono);font-size:11px;background:var(--cd);border:1px solid var(--ln);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--tx2);
}
.pe .seta{margin-left:auto;display:flex;gap:7px}
.pe .seta button{
  border:1px solid var(--ln);background:var(--cd);border-radius:8px;width:34px;height:30px;
  cursor:pointer;font-size:15px;color:var(--tx2);
}
.pe .seta button:hover{color:var(--tt);border-color:var(--tx3)}

/* ── lupa: o slide em tela cheia ─────────────────────────────────────────── */
#lupa{
  position:fixed;inset:0;z-index:50;background:rgba(11,15,22,.9);display:none;
  place-items:center;padding:30px;cursor:zoom-out;
}
#lupa.on{display:grid}
#lupa img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>

<header>
  <div class="marca"><b>Cronos</b><span>Roteiro da banca</span></div>

  <div class="grp">
    <i>Tamanho da fala</i>
    <div class="seg" id="segVer">
      <button data-v="0" aria-pressed="true">Principal</button>
      <button data-v="1" aria-pressed="false">Curta</button>
      <button data-v="2" aria-pressed="false">Com detalhe</button>
    </div>
  </div>

  <div class="grp">
    <i>Mostrar</i>
    <div class="seg" id="segModo">
      <button data-m="fala" aria-pressed="true">Fala completa</button>
      <button data-m="chaves" aria-pressed="false">Palavras-chave</button>
    </div>
  </div>

  <span class="relogio" id="relogio">—</span>
</header>

<nav class="trilha" id="trilha"></nav>

<main>
  <div class="lado-slide">
    <div class="moldura"><img id="foto" src="" alt="" loading="lazy"></div>
    <div class="abaixo">
      <span class="num" id="numero">—</span>
      <span id="tempo"></span>
      <button class="lupa" id="btLupa">Ampliar o slide</button>
    </div>
  </div>

  <div class="lado-fala">
    <div class="papel">
      <h1 class="tit" id="titulo">—</h1>
      <p class="sub" id="subtitulo"></p>
      <div id="corpo"></div>
    </div>
    <div class="pe">
      <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> slide</span>
      <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> tamanho da fala</span>
      <span><kbd>T</kbd> troca fala / chaves</span>
      <span class="seta">
        <button id="btAnt" aria-label="Slide anterior">&larr;</button>
        <button id="btProx" aria-label="Próximo slide">&rarr;</button>
      </span>
    </div>
  </div>
</main>

<div id="lupa"><img src="" alt=""></div>

<script>
/* ═══ AS FALAS ═══════════════════════════════════════════════════════════════
   Uma entrada por slide. Cada entrada tem título, um subtítulo curto que diz o
   que aquele slide precisa entregar, e três versões de fala:

     0 · PRINCIPAL    a fala que vai ao ar.
     1 · CURTA        a mesma coisa em menos palavras, para quando o relógio apertar.
     2 · COM DETALHE  a mesma coisa com o contexto extra que a banca pode querer.

   As três são a MESMA voz: o dono do projeto gravou como fala, em 11/09/2026, e
   o roteiro segue aquilo. Frase que corre, ligada por "e" e por "que", não frase
   curta cortada — a primeira tentativa errou justamente aí.

   `fala` são os parágrafos. `chaves` são as âncoras para lembrar em pé, e cada
   uma é o que ele olharia de relance — nunca a frase inteira.
   ══════════════════════════════════════════════════════════════════════════ */

   slide de propósito não cobre:

   slide 18 · dizer como cada baseline foi construído, em uma frase cada:
     · baseline média-7   → a previsão de amanhã é a média dos últimos 7 dias.
                            É o melhor baseline no P2 (4,9 contra 4,2 do Prophet).
     · baseline sazonal-7 → a previsão de amanhã é o que aconteceu no mesmo dia
                            da semana anterior. É o melhor no P3 (11,3 contra
                            11,8 do Prophet), ou seja, ali ele ganha da gente.
     Os dois nomes estão no cartão do slide e na legenda da figura.

   slide 21 · resumir o que cada uma das três métricas mede:
     · ROC AUC  → chance de o modelo dar nota maior para um caso que violou do
                  que para um que não violou. 0,5 é moeda; 0,869 é o nosso.
     · PR-AUC   → o mesmo, mas contando só os acertos entre os apontados. É a
                  que vale quando o evento é raro: 1% da base viola.
     · Calibração → se o modelo diz 5%, cinco em cem violam de fato. É o que
                  permite somar as notas da fila e projetar o ano.
   ─────────────────────────────────────────────────────────────────────────── */

        "sobram <b>25.600</b>, uns <b>21%</b>",
        "prazo: <b>4 h</b> na prioridade 2, <b>12 h</b> na prioridade 3",
        "passou do prazo = <b>quebra</b>",
        "a <b>soma das quebras do ano</b> define a nota da operação"
      ]
    }
  ]
}

};

/* ═══ o resto se monta sozinho ══════════════════════════════════════════════ */
(function(){
  const TOTAL = 33;
  /* ritmo de fala apresentando, em português: 145 palavras por minuto. Serve
     para somar o deck inteiro, não para cronometrar um slide. */
  const PPM = 145;

  const foto = document.getElementById("foto");
  const numero = document.getElementById("numero");
  const tempo = document.getElementById("tempo");
  const titulo = document.getElementById("titulo");
  const subtitulo = document.getElementById("subtitulo");
  const corpo = document.getElementById("corpo");
  const trilha = document.getElementById("trilha");
  const relogio = document.getElementById("relogio");
  const lupa = document.getElementById("lupa");

  let slide = 1, versao = 0, modo = "fala";

  const dois = n => String(n).padStart(2, "0");
  const semTag = s => s.replace(/<[^>]+>/g, "");
  const palavras = s => semTag(s).trim().split(/\s+/).filter(Boolean).length;

  function segundos(n, v){
    const e = FALAS[n];
    if(!e) return 0;
    return Math.round(e.versoes[v].fala.reduce((s,p) => s + palavras(p), 0) / PPM * 60);
  }
  function mmss(s){
    const m = Math.floor(s/60);
    return m ? `${m}min ${dois(s%60)}s` : `${s}s`;
  }

  /* ── a trilha ──────────────────────────────────────────────────────────── */
  /* os divisores de seção ganham um fio antes: a trilha vira o mapa do deck */
  const DIVISORIAS = [7,12,16,19,23,25,28];
  for(let n = 1; n <= TOTAL; n++){
    if(DIVISORIAS.includes(n)){
      const fio = document.createElement("span");
      fio.className = "corte";
      trilha.appendChild(fio);
    }
    const b = document.createElement("button");
    b.textContent = dois(n);
    b.dataset.n = n;
    if(FALAS[n]) b.classList.add("tem");
    b.addEventListener("click", () => { slide = n; pinta(); });
    trilha.appendChild(b);
  }

  function pinta(){
    foto.src = `_png/roteiro/${dois(slide)}.png`;
    foto.alt = `Slide ${slide}`;
    lupa.querySelector("img").src = foto.src;

    const e = FALAS[slide];
    numero.textContent = `slide ${dois(slide)} de ${TOTAL}`;

    for(const b of trilha.querySelectorAll("button"))
      b.classList.toggle("aqui", +b.dataset.n === slide);

    if(!e){
      titulo.textContent = "Fala ainda não escrita";
      subtitulo.textContent = "";
      tempo.textContent = "";
      corpo.innerHTML = `<div class="vazio"><b>Este slide está sem roteiro.</b>
        Os dois primeiros existem para escolher o jeito de falar. Escolhido o jeito,
        o resto do deck entra aqui no mesmo formato.</div>`;
      return;
    }

    titulo.textContent = e.titulo;
    subtitulo.innerHTML = `Precisa entregar: ${e.precisa}`;
    tempo.textContent = `≈ ${mmss(segundos(slide, versao))} de fala`;

    const v = e.versoes[versao];
    corpo.innerHTML = modo === "fala"
      ? `<div class="fala">${v.fala.map(p => `<p>${p}</p>`).join("")}</div>`
      : `<ul class="chaves">${v.chaves.map(c => `<li><span>${c}</span></li>`).join("")}</ul>`;

    if(e.nota) corpo.insertAdjacentHTML("beforeend", `<div class="nota">${e.nota}</div>`);
  }

  function contaTotal(){
    const escritos = Object.keys(FALAS).length;
    const s = Object.keys(FALAS).reduce((t,n) => t + segundos(+n, versao), 0);
    relogio.innerHTML = `<b>${escritos}</b> de ${TOTAL} escritos · <b>${mmss(s)}</b> somados`;
  }

  /* ── controles ─────────────────────────────────────────────────────────── */
  document.getElementById("segVer").addEventListener("click", ev => {
    const b = ev.target.closest("button"); if(!b) return;
    versao = +b.dataset.v;
    for(const o of ev.currentTarget.children)
      o.setAttribute("aria-pressed", o === b);
    pinta(); contaTotal();
  });

  document.getElementById("segModo").addEventListener("click", ev => {
    const b = ev.target.closest("button"); if(!b) return;
    modo = b.dataset.m;
    for(const o of ev.currentTarget.children)
      o.setAttribute("aria-pressed", o === b);
    pinta();
  });

  function trocaModo(){
    modo = modo === "fala" ? "chaves" : "fala";
    for(const o of document.getElementById("segModo").children)
      o.setAttribute("aria-pressed", o.dataset.m === modo);
    pinta();
  }
  function vai(d){ slide = Math.min(TOTAL, Math.max(1, slide + d)); pinta(); }

  document.getElementById("btAnt").addEventListener("click", () => vai(-1));
  document.getElementById("btProx").addEventListener("click", () => vai(1));

  document.getElementById("btLupa").addEventListener("click", () => lupa.classList.add("on"));
  lupa.addEventListener("click", () => lupa.classList.remove("on"));

  window.addEventListener("keydown", ev => {
    const k = ev.key.toLowerCase();
    if(ev.key === "ArrowRight"){ ev.preventDefault(); vai(1); }
    else if(ev.key === "ArrowLeft"){ ev.preventDefault(); vai(-1); }
    else if(k === "t"){ trocaModo(); }
    else if(k === "escape"){ lupa.classList.remove("on"); }
    else if(k >= "1" && k <= "3"){
      versao = +k - 1;
      for(const o of document.getElementById("segVer").children)
        o.setAttribute("aria-pressed", +o.dataset.v === versao);
      pinta(); contaTotal();
    }
  });

  pinta(); contaTotal();
})();
</script>
</body>
</html>
