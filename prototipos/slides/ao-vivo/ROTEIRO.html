<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronos · Roteiro da banca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   ROTEIRO DA BANCA — slide de um lado, fala do outro.

   Página de CONSULTA. Não se decide nada aqui: as falas estão fechadas no
   objeto FALAS e a divisão de quem apresenta veio junto, no campo `quem` de
   cada entrada, que é o mesmo valor do `data-quem` do bloco no deck.

   Acrescentar slide é acrescentar entrada — o resto se monta sozinho.
   ───────────────────────────────────────────────────────────────────────── */
:root{
  --pg:#F4F6FA; --cd:#FFFFFF; --tt:#0B0F16; --tx:#3D4757; --tx2:#67717F;
  --tx3:#9AA3B0; --ln:#E4E8EF; --ac:#2563EB; --ac-bg:#EEF3FF;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--pg);color:var(--tx);
  font:400 15px/1.6 Outfit,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}

/* ── barra de cima ───────────────────────────────────────────────────────── */
header{
  flex-shrink:0;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:13px 26px;background:var(--cd);border-bottom:1px solid var(--ln);
}
.marca{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.marca b{font-size:16px;font-weight:800;letter-spacing:-.3px;color:var(--tt)}
.marca span{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tx3)}

.seg{display:flex;background:var(--pg);border:1px solid var(--ln);border-radius:9px;padding:3px}
.seg button{
  border:0;background:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  color:var(--tx2);padding:5px 13px;border-radius:6px;transition:.14s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;
}
.seg button:hover{color:var(--tt)}
.seg button[aria-pressed="true"]{background:var(--tt);color:#fff}
.seg button i{width:8px;height:8px;border-radius:50%;background:var(--qc);flex-shrink:0}
.seg button[aria-pressed="true"] i{box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}

.relogio{
  font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--tx2);
  padding:6px 12px;background:var(--pg);border:1px solid var(--ln);border-radius:8px;
  white-space:nowrap;
}
.relogio b{color:var(--tt);font-weight:700}

/* ── trilha dos slides ───────────────────────────────────────────────────── */
.trilha{
  flex-shrink:0;display:flex;gap:4px;overflow-x:auto;padding:9px 26px;
  background:var(--cd);border-bottom:1px solid var(--ln);scrollbar-width:thin;
}
.trilha button{
  flex-shrink:0;width:30px;height:26px;border:1px solid var(--ln);background:var(--cd);
  border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:500;
  color:var(--tx3);transition:.12s;position:relative;
}
.trilha button:hover{border-color:var(--tx3)}
.trilha .corte{flex-shrink:0;width:1px;background:var(--ln);margin:0 6px}
/* o dono TINGE o botão inteiro, e não um fio de 3px: área grande separa matiz
   parecido, fio fino não */
.trilha button[class*="q-"]{
  background:color-mix(in srgb, var(--qc) 13%, #fff);
  border-color:color-mix(in srgb, var(--qc) 34%, #fff);
  color:color-mix(in srgb, var(--qc) 78%, #0B0F16)}
.trilha button[class*="q-"]::before{
  content:"";position:absolute;left:5px;right:5px;top:2px;height:3px;border-radius:2px;
  background:var(--qc)}
.trilha button.aqui{background:var(--tt);border-color:var(--tt);color:#fff}
.trilha button.aqui::before{background:rgba(255,255,255,.55)}
/* com filtro ligado, quem está fora some do caminho sem sumir da página */
.trilha button.fora{opacity:.26}

/* ── palco ───────────────────────────────────────────────────────────────── */
main{
  flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(380px,.85fr);
  gap:26px;padding:24px 26px;overflow:hidden;
}
@media (max-width:1180px){ main{grid-template-columns:1fr;overflow:auto} }

.lado-slide{display:flex;flex-direction:column;gap:14px;min-width:0}
.moldura{
  background:var(--cd);border:1px solid var(--ln);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(11,15,22,.04),0 20px 44px -30px rgba(11,15,22,.35);
}
.moldura img{display:block;width:100%;height:auto}
.abaixo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;
  color:var(--tx2)}
.abaixo .num{font-family:var(--mono);font-weight:700;color:var(--tt)}
.abaixo .lupa{
  margin-left:auto;border:1px solid var(--ln);background:var(--cd);border-radius:7px;
  padding:5px 11px;font:inherit;font-size:12.5px;color:var(--tx2);cursor:pointer;
}
.abaixo .lupa:hover{color:var(--tt);border-color:var(--tx3)}

/* ── coluna da fala ──────────────────────────────────────────────────────── */
.lado-fala{display:flex;flex-direction:column;min-height:0}
/* o cartão tem a altura do texto, e não a da coluna: esticado, um slide de
   trinta segundos virava uma caixa branca vazia de mil pixels */
.papel{
  flex:0 1 auto;min-height:0;overflow:auto;background:var(--cd);border:1px solid var(--ln);
  border-radius:14px;padding:24px 28px 30px;box-shadow:0 1px 2px rgba(11,15,22,.04);
}
.cab{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.tit{margin:0 0 3px;font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--tt);
  text-wrap:balance}
.sub{margin:0;font-size:13px;color:var(--tx3)}

/* de quem é a vez: rótulo, não escolha */
.dono{display:inline-flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap;
  padding:5px 13px 5px 5px;border-radius:999px;
  background:color-mix(in srgb, var(--qc) 12%, #fff);
  border:1px solid color-mix(in srgb, var(--qc) 30%, #fff);
  font-size:13px;font-weight:700;color:color-mix(in srgb, var(--qc) 76%, #0B0F16)}
.dono img{width:26px;height:26px;border-radius:50%;object-fit:cover}

.fala p{margin:0 0 15px;font-size:17px;line-height:1.72;color:var(--tt)}
.fala p:last-child{margin-bottom:0}
.fala em{font-style:normal;background:linear-gradient(transparent 62%,#DBE7FF 0);
  padding:0 1px;font-weight:600}

.chaves{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.chaves li{
  display:flex;gap:13px;align-items:flex-start;font-size:16.5px;line-height:1.5;
  color:var(--tt);padding-bottom:11px;border-bottom:1px dashed var(--ln);
}
.chaves li:last-child{border-bottom:0;padding-bottom:0}
.chaves li::before{content:"";flex-shrink:0;width:7px;height:7px;margin-top:9px;
  border-radius:50%;background:var(--ac)}
.chaves b{font-weight:700}
.chaves i{font-style:normal;color:var(--tx2);font-size:15px}

.nota{
  margin-top:24px;padding:13px 15px;background:var(--ac-bg);border-radius:10px;
  font-size:13.5px;line-height:1.6;color:#1E3A8A;
}
.nota b{font-weight:700}
.nota code{font-family:var(--mono);font-size:12.5px;background:rgba(37,99,235,.1);
  padding:1px 5px;border-radius:4px}

.pe{
  flex-shrink:0;display:flex;align-items:center;gap:13px;padding-top:13px;
  font-size:11.5px;color:var(--tx3);flex-wrap:wrap;
}
.pe kbd{
  font-family:var(--mono);font-size:11px;background:var(--cd);border:1px solid var(--ln);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--tx2);
}
.pe .seta{margin-left:auto;display:flex;gap:7px}
.pe .seta button{
  border:1px solid var(--ln);background:var(--cd);border-radius:8px;width:34px;height:30px;
  cursor:pointer;font-size:15px;color:var(--tx2);
}
.pe .seta button:hover{color:var(--tt);border-color:var(--tx3)}

/* ── lupa: o slide em tela cheia ─────────────────────────────────────────── */
#lupa{
  position:fixed;inset:0;z-index:50;background:rgba(11,15,22,.9);display:none;
  place-items:center;padding:30px;cursor:zoom-out;
}
#lupa.on{display:grid}
#lupa img{max-width:100%;max-height:100%;border-radius:8px}

/* A cor de cada voz, na trilha e no rótulo do dono. O amarelo tem um segundo
   tom para quando o fundo é a própria cor e o texto fica branco. */
.q-igor{--qc:#DC2626} .q-hygor{--qc:#2563EB} .q-ana{--qc:#CA8A04}
</style>
</head>
<body>

<header>
  <div class="marca"><b>Cronos</b><span>Roteiro da banca</span></div>

  <div class="seg" id="segModo">
    <button data-m="fala" aria-pressed="true">Fala completa</button>
    <button data-m="chaves" aria-pressed="false">Palavras-chave</button>
  </div>

  <div class="seg" id="segQuem">
    <button data-q="" aria-pressed="true">Todos</button>
    <button data-q="igor" class="q-igor" aria-pressed="false"><i></i>Igor</button>
    <button data-q="ana" class="q-ana" aria-pressed="false"><i></i>Ana</button>
    <button data-q="hygor" class="q-hygor" aria-pressed="false"><i></i>Hygor</button>
  </div>

  <span class="relogio" id="relogio">—</span>
</header>

<nav class="trilha" id="trilha"></nav>

<main>
  <div class="lado-slide">
    <div class="moldura"><img id="foto" src="" alt="" loading="lazy"></div>
    <div class="abaixo">
      <span class="num" id="numero">—</span>
      <span id="tempo"></span>
      <button class="lupa" id="btLupa">Ampliar o slide</button>
    </div>
  </div>

  <div class="lado-fala">
    <div class="papel">
      <div class="cab">
        <div>
          <h1 class="tit" id="titulo">—</h1>
          <p class="sub" id="subtitulo"></p>
        </div>
        <span class="dono" id="dono"></span>
      </div>
      <div id="corpo"></div>
    </div>
    <div class="pe">
      <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> slide</span>
      <span><kbd>T</kbd> fala / palavras-chave</span>
      <span class="seta">
        <button id="btAnt" aria-label="Slide anterior">&larr;</button>
        <button id="btProx" aria-label="Próximo slide">&rarr;</button>
      </span>
    </div>
  </div>
</main>

<div id="lupa"><img src="" alt=""></div>

<script>

   uma é o que se olha de relance — nunca a frase inteira. `nota` é material de
   apoio para pergunta da banca, e não entra na fala.

/* ═══════════════════════════════════════════════════════════════════════════
   O MOTOR
   Nada é guardado: a página abre igual toda vez. O que existia de estado —
   edição, escolha de versão, escolha de dono, selo — saiu junto com a fase de
   decisão. O que sobra é navegação.
   ═══════════════════════════════════════════════════════════════════════════ */
(function(){
  "use strict";

  const TOTAL = 33;
  const DIVISORIAS = [7, 12, 16, 19, 22, 24, 28];   // onde a trilha ganha um corte
  const PPM = 145;                                  // palavras por minuto, o ritmo dele
  const EQUIPE = {
    igor:  {nome: "Igor",  foto: "../../../brand/equipe/igor.png"},
    ana:   {nome: "Ana",   foto: "../../../brand/equipe/ana-beatriz.png"},
    hygor: {nome: "Hygor", foto: "../../../brand/equipe/hygor.png"}
  };

  let slide = 1, modo = "fala", filtro = "";

  const $ = id => document.getElementById(id);
  const dois = n => String(n).padStart(2, "0");
  const semTag = s => s.replace(/<[^>]+>/g, " ");
  const palavras = n => {
    const e = FALAS[n];
    return e ? semTag(e.versoes[0].fala.join(" ")).trim().split(/\s+/).length : 0;
  };
  const seg = n => Math.round(palavras(n) / PPM * 60);
  const relogio = s => {
    const m = Math.floor(s / 60), r = s % 60;
    return m ? `${m}min${dois(r)}` : `${r}s`;
  };
  const donoDe = n => (FALAS[n] && FALAS[n].quem) || null;
  const visivel = n => !filtro || donoDe(n) === filtro;

  /* ── a trilha ──────────────────────────────────────────────────────────── */
  function trilha(){
    const t = $("trilha");
    t.innerHTML = "";
    for (let n = 1; n <= TOTAL; n++){
      if (DIVISORIAS.includes(n)){
        const c = document.createElement("span");
        c.className = "corte";
        t.appendChild(c);
      }
      const d = donoDe(n);
      const b = document.createElement("button");
      b.textContent = dois(n);
      b.className = (d ? "q-" + d : "") + (n === slide ? " aqui" : "")
                  + (visivel(n) ? "" : " fora");
      b.title = `Slide ${dois(n)} · ${FALAS[n] ? FALAS[n].titulo : "sem fala"}`
              + (d ? ` · ${EQUIPE[d].nome}` : "");
      b.onclick = () => { slide = n; pinta(); };
      t.appendChild(b);
    }
    const aqui = t.querySelector(".aqui");
    if (aqui) aqui.scrollIntoView({block: "nearest", inline: "center"});
  }

  /* ── o cartão ──────────────────────────────────────────────────────────── */
  function pinta(){
    const e = FALAS[slide];
    const d = donoDe(slide);

    $("foto").src = `_png/roteiro/${dois(slide)}.png`;
    $("foto").alt = e ? e.titulo : `Slide ${slide}`;
    $("lupa").querySelector("img").src = $("foto").src;
    $("numero").textContent = `Slide ${dois(slide)} de ${TOTAL}`;
    $("tempo").textContent = e ? `~${relogio(seg(slide))} de fala` : "";

    $("titulo").textContent = e ? e.titulo : `Slide ${slide}`;
    $("subtitulo").textContent = e && e.precisa ? e.precisa : "";

    const dn = $("dono");
    dn.className = "dono" + (d ? " q-" + d : "");
    dn.innerHTML = d
      ? `<img src="${EQUIPE[d].foto}" alt=""><b>${EQUIPE[d].nome}</b>`
      : "";
    dn.hidden = !d;

    const v = e && e.versoes[0];
    $("corpo").innerHTML = !v ? "" : (
      (modo === "fala"
        ? `<div class="fala">${v.fala.map(p => `<p>${p}</p>`).join("")}</div>`
        : `<ul class="chaves">${v.chaves.map(c => `<li>${c}</li>`).join("")}</ul>`)
      + (e.nota ? `<div class="nota">${e.nota}</div>` : "")
    );

    document.querySelectorAll("#segModo button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.m === modo)));
    document.querySelectorAll("#segQuem button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.q === filtro)));

    trilha();
    conta();
  }

  /* ── o relógio do cabeçalho: o total, ou o da pessoa filtrada ──────────── */
  function conta(){
    const ns = [];
    for (let n = 1; n <= TOTAL; n++) if (FALAS[n] && visivel(n)) ns.push(n);
    const s = ns.reduce((a, n) => a + seg(n), 0);
    const r = $("relogio");
    r.innerHTML = filtro
      ? `${EQUIPE[filtro].nome}: <b>${ns.length}</b> slides · <b>${relogio(s)}</b>`
      : `<b>${ns.length}</b> slides · <b>${relogio(s)}</b> de fala`;
    r.title = "A demonstração ao vivo, no slide 31, corre por fora desta conta.";
  }

  /* ── andar ─────────────────────────────────────────────────────────────── */
  function anda(passo){
    let n = slide;
    for (let i = 0; i < TOTAL; i++){
      n += passo;
      if (n < 1) n = TOTAL; else if (n > TOTAL) n = 1;
      if (visivel(n)) break;      // com filtro ligado, pula quem não é da vez
    }
    slide = n; pinta();
  }

  $("segModo").onclick = ev => {
    const b = ev.target.closest("button"); if (!b) return;
    modo = b.dataset.m; pinta();
  };
  $("segQuem").onclick = ev => {
    const b = ev.target.closest("button"); if (!b) return;
    filtro = b.dataset.q;
    if (filtro && !visivel(slide)) anda(1); else pinta();
  };
  $("btAnt").onclick = () => anda(-1);
  $("btProx").onclick = () => anda(1);
  $("btLupa").onclick = () => $("lupa").classList.add("on");
  $("lupa").onclick = () => $("lupa").classList.remove("on");

  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") return $("lupa").classList.remove("on");
    if (ev.key === "ArrowLeft")  { ev.preventDefault(); anda(-1); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); anda(1); }
    if (ev.key === "t" || ev.key === "T"){
      modo = modo === "fala" ? "chaves" : "fala"; pinta();
    }
  });

  pinta();
})();

</script>
</body>
</html>
