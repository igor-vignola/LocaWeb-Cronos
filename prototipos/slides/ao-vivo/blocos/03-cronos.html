<style>
/* ═══ slide 3 · por que Cronos ═══════════════════════════════════════════════
   O slide que faltava. O dono do projeto pediu um começo que dissesse o que é o
   Cronos e de onde vem o nome, antes de qualquer número.

   É o único slide do deck sem número nenhum, de propósito. Ele existe para dar
   à sala a chave de leitura de tudo o que vem depois: o assunto é tempo, e todo
   incidente tem um prazo correndo.

   O objeto é um relógio de traço fino à direita, com o arco do prazo se
   preenchendo e o ponteiro girando. Ele não mede nada e não carrega dado: é o
   assunto desenhado. Fica em opacidade baixa para não competir com a
   tipografia, que é quem manda aqui.

   A palavra CRONOS entra letra por letra, com a mesma animação da capa, e o
   grego aparece antes dela. A tagline fecha, e é ela que o slide 18 devolve.
   ══════════════════════════════════════════════════════════════════════════ */
.crn .body{justify-content:center;padding-bottom:70px}
.cr-a .cena{display:flex;align-items:center;gap:60px}
.cr-a .txt{flex:1;min-width:0}

/* ── o relógio ── */
.cr-a .rel{width:430px;height:430px;flex-shrink:0;position:relative;opacity:0}
.cr-a.is-active .rel{animation:relSurge 1.4s var(--out) .6s forwards}
@keyframes relSurge{to{opacity:1}}
.cr-a .rel svg{width:100%;height:100%;display:block}
.cr-a .rel .aro{fill:none;stroke:var(--accent3);stroke-width:1.4;opacity:.28}
.cr-a .rel .marca{stroke:var(--accent3);stroke-width:2;opacity:.44;stroke-linecap:round}
/* o arco do prazo, que se preenche uma vez e fica */
.cr-a .rel .arco{fill:none;stroke:var(--accent3);stroke-width:5;stroke-linecap:round;
  opacity:.5;stroke-dasharray:1508;stroke-dashoffset:1508;
  transform:rotate(-90deg);transform-origin:250px 250px}
.cr-a.is-active .rel .arco{animation:arcoEnche 3.4s var(--out) 1.1s forwards}
@keyframes arcoEnche{to{stroke-dashoffset:377}}
.cr-a .rel .pont{transform-origin:250px 250px;animation:relGira 20s linear infinite}
.cr-a .rel .pont line{stroke:#fff;stroke-width:2.4;opacity:.5;stroke-linecap:round}
.cr-a .rel .miolo{fill:var(--accent3);opacity:.5}
@keyframes relGira{to{transform:rotate(360deg)}}

.cr-a .grego{display:block;font-family:var(--mono);font-size:18px;letter-spacing:5px;
  color:var(--accent3);opacity:0;transform:translate3d(0,10px,0)}
.cr-a.is-active .grego{animation:rv .7s var(--out) .35s forwards}

/* a palavra, letra por letra */
.cr-a .word{display:flex;overflow:hidden;padding-bottom:.07em;margin-top:14px;
  font-family:var(--font);font-weight:900;font-size:158px;letter-spacing:-7.2px;
  line-height:.94;color:#fff}
.cr-a .word i{font-style:normal;display:inline-block;transform:translate3d(0,112%,0)}
.cr-a.is-active .word i{animation:crnLetra .95s var(--spring) forwards;animation-delay:var(--d,0ms)}
@keyframes crnLetra{to{transform:none}}

.cr-a .oq{font-size:17px;color:#B7C0CB;margin-top:2px;letter-spacing:.2px}

.cr-a .tese{font-size:31px;line-height:1.36;color:#E8ECF3;margin-top:44px;max-width:19ch;
  font-weight:500;letter-spacing:-.4px}
.cr-a .tese b{color:#fff;font-weight:700}
.cr-a .tese em{font-style:normal;color:var(--accent3);font-weight:700}

.cr-a .assina{display:flex;align-items:center;gap:16px;margin-top:40px;
  font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:4.2px;
  text-transform:uppercase;color:#B7C0CB}
.cr-a .assina::before{content:"";width:44px;height:2px;border-radius:2px;
  background:var(--accent3);opacity:.6;transform:scaleX(0);transform-origin:left}
.cr-a.is-active .assina::before{animation:tick .8s var(--out) 2.5s forwards}


/* ── variação B · a marca em caixa alta e baixa ────────────────────────────
   Idêntica à A em tudo, menos na palavra: "Cronos" em vez de "CRONOS". Em
   caixa alta a marca lê como sigla; em caixa alta e baixa lê como nome, que é
   o que ela é, e é assim que aparece na capa e no cabeçalho de todo slide.
   A caixa muda a largura da palavra, então o corpo sobe e o espaçamento
   aperta para o bloco ocupar a mesma faixa. */
.cr-b .word{font-size:186px;letter-spacing:-8.6px}
</style>

<section class="slide dark crn cr-a cr-b" data-slide="3" data-var="a" data-quem="igor">
  <div class="mesh"></div><div class="grid-bg"></div>
  <div class="hd">
    <div class="bi"><svg viewBox="0 0 28 28" fill="none"><path d="M6 22L12 14L16 17L22 8" stroke="#0A0E17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="8" r="3" stroke="#2563EB" stroke-width="1.5"/><circle cx="22" cy="8" r="1.2" fill="#2563EB"/></svg></div>
    <div class="bn">Cronos</div>
    <div class="tag">O nome</div>
  </div>
  <div class="body">
    <div class="cena">
      <div class="txt">
        <span class="grego">&Chi;&rho;&oacute;&nu;&omicron;&sigmaf;</span>
        <div class="word">
          <i style="--d:600ms">C</i><i style="--d:670ms">r</i><i style="--d:740ms">o</i><i style="--d:810ms">n</i><i style="--d:880ms">o</i><i style="--d:950ms">s</i>
        </div>
        <p class="oq rv" style="--d:1200ms">o deus grego do tempo</p>
        <p class="tese rv" style="--d:1600ms">Todo incidente tem um <b>prazo correndo</b>. O Cronos existe para ver o prazo <em>antes de ele estourar</em>.</p>
        <div class="assina rv" style="--d:2500ms">Veja antes. Aja antes.</div>
      </div>

      <div class="rel">
        <svg viewBox="0 0 500 500" aria-hidden="true">
          <circle class="aro" cx="250" cy="250" r="240"/>
          <circle class="aro" cx="250" cy="250" r="196"/>
          <g class="marca">
            <line x1="250" y1="14" x2="250" y2="40"/><line x1="486" y1="250" x2="460" y2="250"/>
            <line x1="250" y1="486" x2="250" y2="460"/><line x1="14" y1="250" x2="40" y2="250"/>
            <line x1="416.9" y1="83.1" x2="398.5" y2="101.5"/><line x1="416.9" y1="416.9" x2="398.5" y2="398.5"/>
            <line x1="83.1" y1="416.9" x2="101.5" y2="398.5"/><line x1="83.1" y1="83.1" x2="101.5" y2="101.5"/>
          </g>
          <circle class="arco" cx="250" cy="250" r="240"/>
          <g class="pont"><line x1="250" y1="250" x2="250" y2="66"/></g>
          <circle class="miolo" cx="250" cy="250" r="5"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="ft"></div>
</section>
