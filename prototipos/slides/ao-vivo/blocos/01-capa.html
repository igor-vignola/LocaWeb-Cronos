<style>
/* ═══ slide 1 · capa · composição A ═══════════════════════════════════════════
   Refeita em 10/09/2026 na forma que o dono do projeto apontou: a capa do deck
   da Sprint 2 (`prototipos/slides/capa-slide.html`). Borrões azuis desfocados
   sobre o branco, rótulo de vidro em versalete, a marca em 220px, a assinatura
   de duas partes. Nada mais.

   O que saiu, a pedido dele:
     · a régua do pé com "Super Data Bros · Turma 2TSCOA" e "Challenge FIAP
       2026 com Locaweb" — o cabeçalho já traz a segunda e o slide 2 traz a
       primeira;
     · o cartão de créditos com equipe e mentor, que a referência tem e ele
       mandou tirar antes, porque o slide 2 é inteiro deles;
     · a linha de apoio "Lê o histórico de incidentes da Locaweb e avisa antes
       do KPI estourar", da referência, que ele leu como frase de IA;
     · o fio da série de 2025, que a referência não tem. Ele continua na
       composição B.

   Os borrões são pseudo-elementos, não `<div>`: eles sangram pela borda de
   propósito, e elemento real ali seria acusado de "fora do palco" pelo
   verificador.

   "Veja antes. Aja antes." é a tagline registrada, e é o único lugar do deck
   onde uma frase de marca é permitida. Na referência a primeira metade é
   preta e a segunda cinza; aqui é igual.

   `cap-letra` é usado também pela composição B, em 01-capa-b.html. Nome de
   keyframe é global no deck montado.
   ══════════════════════════════════════════════════════════════════════════ */
.cap{background:#fff;overflow:hidden}
.cap .mesh{background:
  radial-gradient(900px 640px at 20% 20%,rgba(37,99,235,.18),transparent 52%),
  radial-gradient(880px 620px at 80% 70%,rgba(37,99,235,.15),transparent 56%),
  radial-gradient(760px 460px at 50% 104%,rgba(17,17,17,.06),transparent 60%)}
.cap .grid-bg{background-image:linear-gradient(rgba(17,24,39,.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(17,24,39,.03) 1px,transparent 1px);background-size:48px 48px}

/* os três borrões da referência */
.cap::before,.cap::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);
  pointer-events:none;z-index:0}
.cap::before{width:520px;height:520px;top:-160px;left:-110px;background:rgba(37,99,235,.30)}
.cap::after{width:420px;height:420px;bottom:-130px;right:-90px;background:rgba(37,99,235,.22)}
.cap .body::before{content:"";position:absolute;width:310px;height:310px;left:8%;top:58%;
  border-radius:50%;filter:blur(80px);background:rgba(17,17,17,.08);pointer-events:none;z-index:0}

.cap .body{padding:14px 64px 64px;align-items:stretch;justify-content:flex-start}
.cap .hero{flex:1;min-height:0;position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}

/* o selo volta à letra do deck, em caixa de frase: a versão em versalete mono
   da referência ficou com cara de gerada. */
.cap .pil{font-size:15.5px;font-weight:600;letter-spacing:.1px;color:var(--accent);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 22px;
  box-shadow:0 6px 20px -10px rgba(37,99,235,.32)}

/* a marca entra letra por letra */
/* o overflow:hidden é o que faz a máscara das letras subirem. Sem folga
   lateral ele corta o glifo: o -10px de letter-spacing vale também DEPOIS do
   último caractere, e o 's' ficava com a barriga cortada na direita. Padding
   nos dois lados dá a folga e mantém o bloco centrado; a última letra perde o
   espacejamento para o conjunto ficar óptica e geometricamente no meio. */
.cap .word{display:flex;justify-content:center;overflow:hidden;margin-top:26px;
  font-size:220px;font-weight:900;letter-spacing:-10px;line-height:.88;color:#000;
  padding:0 18px .06em}
.cap .word i:last-child{letter-spacing:0}
.cap .word i{font-style:normal;display:inline-block;transform:translate3d(0,112%,0)}
.cap.is-active .word i{animation:cap-letra .9s var(--spring) var(--d,0ms) forwards}
@keyframes cap-letra{to{transform:translate3d(0,0,0)}}

.cap .tag2{font-size:40px;font-weight:500;letter-spacing:-.9px;line-height:1.1;color:#5B6879;
  margin-top:14px}
.cap .tag2 b{color:#000;font-weight:700}
