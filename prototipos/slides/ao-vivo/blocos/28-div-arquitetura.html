<style>
/* O desenho da arquitetura é um fluxograma de verdade: caixas e setas, com os
   dois recintos que importam — o que treina e grava, e o que só lê e sobe.
   Antes era uma lista com ícones num trilho, que o dono do projeto apontou
   como pouco parecida com arquitetura.

   É esqueleto de propósito: nomeia as peças e o sentido do fluxo, e deixa o
   número para os slides que vêm depois. Tudo em SVG inline, desenhando-se por
   ordem: as caixas sobem, as setas correm e os dois recintos aparecem por
   último. */
.dv3 .flx{margin-top:14px}
.dv3 .flx svg{width:100%;height:auto;display:block;overflow:visible}
.dv3 .cxa{opacity:0;transform:translate3d(0,8px,0)}
.dv3.is-active .cxa{animation:rv .5s var(--out) var(--d,0ms) forwards}
.dv3 .seta2{stroke:#8AAAE0;stroke-width:1.6;fill:none;stroke-dasharray:var(--len);
  stroke-dashoffset:var(--len)}
.dv3.is-active .seta2{animation:tracar .4s linear var(--d,0ms) forwards}
.dv3 .pta{fill:#8AAAE0;opacity:0}
.dv3.is-active .pta{animation:rv .3s linear var(--d,0ms) forwards}
.dv3 .recinto{fill:none;stroke-dasharray:5 5;opacity:0}
.dv3.is-active .recinto{animation:rv .6s var(--out) var(--d,0ms) forwards}
.dv3 .rot2{opacity:0}
.dv3.is-active .rot2{animation:rv .5s var(--out) var(--d,0ms) forwards}
</style>

<style>
/* a barra segmentada dos artefatos, só desta divisória */
.dv3 .carga{margin-top:16px}
.dv3 .carga .tr{display:flex;gap:3px;height:18px;border-radius:9px;overflow:hidden}
.dv3 .carga .tr i{display:block;height:100%;transform:scaleX(0);transform-origin:left}
.dv3.is-active .carga .tr i{animation:corre .7s var(--out) var(--d,0ms) forwards}
.dv3 .carga .tr i:nth-child(1){background:#2563EB}
.dv3 .carga .tr i:nth-child(2){background:#3B82F6}
.dv3 .carga .tr i:nth-child(3){background:#60A5FA}
.dv3 .carga .lg{display:flex;gap:22px;margin-top:14px;font-size:12.5px;color:#A6B0BD}
.dv3 .carga .lg span{display:flex;align-items:center;gap:8px;font-family:var(--mono)}
.dv3 .carga .lg i{width:8px;height:8px;border-radius:50%}
.dv3 .carga .lg span:nth-child(1) i{background:#2563EB}
.dv3 .carga .lg span:nth-child(2) i{background:#3B82F6}
.dv3 .carga .lg span:nth-child(3) i{background:#60A5FA}
.dv3 .carga .lg b{color:#E8ECF3;font-weight:500}
</style>
