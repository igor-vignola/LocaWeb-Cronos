<style>
/* ═══ slide 1 · composição B da capa · a pegada escura da Sprint 2 ══════════
   O dono do projeto pediu uma composição B para a capa, apontando a capa do
   deck que ele mesmo escolheu, e pediu para tirar equipe e mentor porque o
   slide 2 é inteiro deles. A composição A já não traz créditos; faltava a B.

   A forma vem de prototipos/slides/capa-slide.html, a capa da Sprint 2:
   borrões azuis desfocados, rótulo de vidro, a marca gigante e a assinatura
   embaixo. Aqui ela vem no escuro, para ser de fato uma escolha ao lado da A,
   que é clara — e para conversar com as divisórias `.dv2` e com o slide de
   agradecimento, que também vieram da Sprint 2.

   Os borrões são pseudo-elementos, não `<div>`: eles sangram pela borda de
   propósito, e elemento real ali seria acusado de "fora do palco" pelo
   verificador.

   O fio de fundo é a série real de incidentes elegíveis de 2025, a mesma da
   composição A. A textura do slide é dado, não enfeite.

   O keyframe `cap-letra` é o da composição A e está no arquivo 01-capa.html:
   nome de keyframe é global no deck montado, então aqui ele é reaproveitado
   em vez de duplicado com outro nome.
   ══════════════════════════════════════════════════════════════════════════ */
.cpb{overflow:hidden}
.cpb::before,.cpb::after{content:"";position:absolute;border-radius:50%;
  filter:blur(96px);pointer-events:none;z-index:0}
.cpb::before{width:660px;height:660px;top:-230px;left:-170px;background:rgba(37,99,235,.36)}
.cpb::after{width:520px;height:520px;bottom:-170px;right:-120px;background:rgba(37,99,235,.42)}
.cpb .body::before{content:"";position:absolute;width:380px;height:380px;left:120px;bottom:40px;
  border-radius:50%;filter:blur(96px);background:rgba(96,165,250,.18);pointer-events:none;z-index:0}

/* a série de 2025 atrás da marca */
.cpb .serie{position:absolute;left:0;right:0;bottom:150px;height:290px;z-index:1;
  pointer-events:none}
.cpb .serie svg{width:100%;height:100%;display:block}
.cpb .serie path{fill:none;stroke:#60A5FA;stroke-width:2.5;opacity:.22;
  stroke-dasharray:1000;stroke-dashoffset:1000}
.cpb.is-active .serie path{animation:cap-traca 3.2s var(--out) .5s forwards}

.cpb .body{padding:14px 64px 84px;align-items:stretch;justify-content:flex-start}
.cpb .hero{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;position:relative;z-index:2}

.cpb .pil{font-size:15.5px;font-weight:600;letter-spacing:.1px;color:#BFD5FA;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:999px;
  padding:10px 24px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}

/* a marca entra letra por letra, com o gradiente branco→azul da Sprint 2 */
.cpb .word{display:flex;justify-content:center;overflow:hidden;margin-top:28px;
  font-size:224px;font-weight:900;letter-spacing:-10px;line-height:.9;padding-bottom:.06em}
.cpb .word i{font-style:normal;display:inline-block;transform:translate3d(0,112%,0);
  background:linear-gradient(135deg,#fff 0%,#DBEAFE 46%,#60A5FA 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cpb.is-active .word i{animation:cap-letra .9s var(--spring) var(--d,0ms) forwards}

.cpb .tag2{font-size:58px;font-weight:800;letter-spacing:-2.2px;line-height:1.1;color:#fff;
  margin-top:22px;position:relative}
.cpb .tag2 em{font-style:normal;color:#60A5FA}
.cpb .tag2::after{content:"";position:absolute;left:52%;right:0;bottom:-14px;height:5px;
  border-radius:5px;background:#60A5FA;transform:scaleX(0);transform-origin:left}
.cpb.is-active .tag2::after{animation:tick .9s var(--out) 1.5s forwards}
.cpb .sub{font-size:18px;line-height:1.5;color:#98A2B3;margin-top:34px;max-width:660px}
.cpb .sub b{color:#E8ECF3;font-weight:600}

/* a assinatura do pé, sem nome de ninguém: equipe e mentor têm o slide 2 */
.cpb .regua{position:relative;z-index:2;display:flex;justify-content:space-between;
  align-items:center;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);
  font-family:var(--mono);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.4)}
.cpb .regua b{color:#E8ECF3;font-weight:600}
</style>
